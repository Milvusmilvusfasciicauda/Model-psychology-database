<!DOCTYPE html>

    <title>Model Psychology Database</title>
    <style>
        body { 
            font-family: sans-serif; 
            line-height: 1.6;

        }

        /* Group container for your titles to keep them centered */

        h1 {
            font-family: 'Playfair Display', serif;

            letter-spacing: 1px;

        }

        /* The Link Container: Centers the text block on the page */

            text-align: center;
            margin-top: 30px;
        }

        /* The Secret Weapon: Forces the link to stay on one line, 
           but allows it to scroll or scale if the screen gets too tight */
        .no-split-link {
            color: #0070f3; 
            text-decoration: none;
            white-space: nowrap; 
            display: inline-block;
        }

        .no-split-link:hover { 
            text-decoration: underline; 
        }

</head>
